[project]
name = "reddit-academic-community-intelligence"
version = "1.0.0"
description = "Reproducible interaction community analysis with weighted label propagation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-networkx>=3.6.1.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reddit_communities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
