name: Phase gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
      - run: uv run pip-audit -r requirements.lock
      - run: uv run python scripts/scan_secrets.py
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: uv run python scripts/smoke_test.py
      - run: npx playwright-cli install-browser chrome
        working-directory: frontend
      - run: uv run python scripts/browser_gate.py
      - run: uv run python scripts/benchmark.py
      - name: Build release container
        run: docker build -t community-observatory:ci .
      - name: Container readiness
        run: |
          docker run -d --name observatory -p 127.0.0.1:8000:8000 community-observatory:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs observatory
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-gate-evidence
          path: |
            artifacts/verification/
            output/playwright/
